<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#146c5a">
  <title>فهيمة | مستشارة مشروعك</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="mark">ف</div><div><h1>فهيمة</h1><p>مستشارة مشروعك</p></div><span>الإملاء من المتصفح · صوت Gemini مباشر</span><span id="health">● جاهزة</span></header>
  <main><aside><label for="projects">مشروعاتي</label><select id="projects"></select><button id="newProject">＋ مشروع جديد</button><section><h2>الخطة الحالية</h2><div id="plan">مفيش خطة محفوظة لسه.</div></section><section><h2>المخزون المسجل</h2><div id="inventory">مفيش أصناف مسجلة.</div></section><section><h2>سجل المعاملات</h2><div id="transactions">مفيش معاملات مسجلة.</div></section><section><h2>تقرير المشروع</h2><label>من <input id="reportFrom" type="date"></label><label>إلى <input id="reportTo" type="date"></label><button id="loadReport">اعرضي التقرير</button><div id="report"></div></section></aside>
    <section class="chat"><div id="messages" aria-live="polite"></div><div class="controls"><button id="voice" title="إدخال صوتي">🎙️</button><textarea id="input" rows="2" placeholder="احكيلي عن مشروعك أو اكتبي سؤالك…"></textarea><button id="send">إرسال</button></div><div class="audio-controls"><button id="playReply" hidden>🔊 اسمع الرد</button><button id="cancelTask" hidden>إلغاء المهمة</button><small id="status" aria-live="polite"></small></div></section>
  </main><script src="/app.js" defer></script>
</body></html>
